<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="loader">Loading Vision Model...</div>
    </div>

    <!-- Hidden Video Element for MediaPipe -->
    <video id="input-video" class="input-video" playsinline></video>

    <!-- UI Overlay -->
    <div class="ui-container">
        <div class="header">
            <h1>Particle Mind</h1>
            <p>Pinch to Interact</p>
        </div>

        <div class="controls">
            <!-- Template Selector -->
            <div class="control-group">
                <label>Template</label>
                <div class="template-selector" id="template-selector">
                    <button class="template-btn active" data-template="heart" title="Heart">❤️</button>
                    <button class="template-btn" data-template="flower" title="Flower">🌸</button>
                    <button class="template-btn" data-template="saturn" title="Saturn">🪐</button>
                    <button class="template-btn" data-template="fireworks" title="Fireworks">🎆</button>
                </div>
            </div>

            <!-- Color Picker -->
            <div class="control-group">
                <label>Color</label>
                <div class="color-picker-container">
                    <input type="color" id="particle-color" value="#00ffff">
                </div>
            </div>

             <!-- Fullscreen -->
             <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>
        
        <div class="status-monitor">
            <div class="status-item">
                <span class="status-label">Hand</span>
                <span id="hand-status" class="status-value">Searching...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Pinch</span>
                <span id="pinch-value" class="status-value">0%</span>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
